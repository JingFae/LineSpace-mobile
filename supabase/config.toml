project_id = "linespace"

[api]
# Keep Supabase's local HTTP API outside the Windows-excluded 543xx range.
port = 55421

[db]
# Keep this aligned with the hosted Supabase project's PostgreSQL major version.
major_version = 17
# 54322-54332 are blocked by the current Windows/Docker networking setup.
# This is only the host port for the local database container.
port = 55432
shadow_port = 55430

[studio]
port = 55423

[inbucket]
port = 55424
smtp_port = 55425
pop3_port = 55426

[analytics]
enabled = false

[auth]
site_url = "http://localhost:8081"
# Supabase Auth requires at least 6 characters. LineSpace adds no character-class rules.
minimum_password_length = 6
password_requirements = ""

[auth.email]
# LineSpace registration is owned by the server-side username/password API.
# Direct public email sign-up and email confirmation are intentionally disabled.
enable_signup = false
enable_confirmations = false
