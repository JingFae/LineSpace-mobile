<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">LineSpace technical implementation pipeline</title>
  <desc id="desc">The production code path from Expo clients through a shared typed API contract, Vercel and Node routing, Supabase authorization and domain storage, plus the Community Spark and Thread Version AI pipelines.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5324A"/>
      <stop offset="1" stop-color="#E95638"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#34302E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#151515" flood-opacity="0.10"/>
    </filter>
    <pattern id="paper" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 31.5H32" stroke="#151515" stroke-opacity="0.025"/>
      <circle cx="4" cy="5" r="0.8" fill="#151515" fill-opacity="0.035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#F5324A"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
      .serif { font-family: Georgia, "Noto Serif SC", serif; }
      .kicker { font-size: 14px; font-weight: 800; letter-spacing: 2.4px; }
      .h1 { font-size: 42px; font-weight: 650; }
      .sub { font-size: 17px; fill: #625E5A; }
      .card-title { font-size: 23px; font-weight: 750; fill: #151515; }
      .card-sub { font-size: 14px; font-weight: 750; letter-spacing: 1.3px; fill: #F5324A; }
      .body { font-size: 16px; fill: #3B3937; }
      .small { font-size: 14px; fill: #625E5A; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #3B3937; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#F4F2F0"/>
  <rect width="1600" height="920" fill="url(#paper)"/>
  <path d="M0 0H525L365 920H0Z" fill="#FFFFFF" fill-opacity="0.42"/>

  <g class="sans">
    <text x="64" y="66" class="kicker" fill="#F5324A">IMPLEMENTATION PIPELINE</text>
    <text x="64" y="116" class="h1" fill="#151515">A typed, provenance-aware creative system</text>
    <text x="64" y="148" class="sub">Current code path — client interaction, trust boundary, durable data and bounded AI mediation</text>

    <g transform="translate(1285 42)">
      <rect width="251" height="43" rx="21.5" fill="#151515"/>
      <circle cx="23" cy="21.5" r="6" fill="#63A85E"/>
      <text x="40" y="27" font-size="13" font-weight="750" class="white">AUDITED · main@8f08c97</text>
    </g>

    <path d="M386 378H424" stroke="#F5324A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M756 378H794" stroke="#F5324A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1126 378H1164" stroke="#F5324A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(64 188)" filter="url(#shadow)">
      <rect width="322" height="384" rx="26" fill="#FFFFFF" stroke="#E8E4DF"/>
      <rect x="20" y="20" width="76" height="27" rx="13.5" fill="#FFE4E0"/>
      <text x="35" y="39" class="card-sub">01 · CLIENT</text>
      <text x="22" y="82" class="card-title">Experience layer</text>
      <text x="22" y="111" class="small">One product surface across native and web</text>

      <rect x="22" y="138" width="278" height="56" rx="14" fill="#F9F6EF"/>
      <text x="40" y="162" class="body" font-weight="700">Expo Router + React Native</text>
      <text x="40" y="183" class="small">iOS · Android · static Web export</text>

      <rect x="22" y="207" width="278" height="56" rx="14" fill="#F7F7F6"/>
      <text x="40" y="231" class="body" font-weight="700">Feature screens</text>
      <text x="40" y="252" class="small">Thread · Post · Create · Inbox · Profile</text>

      <rect x="22" y="276" width="278" height="82" rx="14" fill="#F7F7F6"/>
      <text x="40" y="301" class="body" font-weight="700">Session and interaction state</text>
      <text x="40" y="324" class="small">TanStack Query · guest guards · prefetch</text>
      <text x="40" y="346" class="small">SecureStore / sessionStorage refresh token</text>
    </g>

    <g transform="translate(434 188)" filter="url(#shadow)">
      <rect width="322" height="384" rx="26" fill="#FFFFFF" stroke="#E8E4DF"/>
      <rect x="20" y="20" width="98" height="27" rx="13.5" fill="#FFE4E0"/>
      <text x="35" y="39" class="card-sub">02 · CONTRACT</text>
      <text x="22" y="82" class="card-title">Shared domain API</text>
      <text x="22" y="111" class="small">One business interface, two runtime adapters</text>

      <rect x="22" y="138" width="278" height="74" rx="14" fill="#151515"/>
      <text x="40" y="166" class="white" font-size="17" font-weight="750">LineSpaceApi</text>
      <text x="40" y="190" class="mono white">packages/api-client</text>

      <rect x="22" y="227" width="132" height="67" rx="14" fill="#F9F6EF"/>
      <text x="40" y="253" class="body" font-weight="700">Mock</text>
      <text x="40" y="276" class="small">in-process</text>
      <rect x="168" y="227" width="132" height="67" rx="14" fill="#F7F7F6"/>
      <text x="186" y="253" class="body" font-weight="700">HTTP</text>
      <text x="186" y="276" class="small">/v1/*</text>

      <text x="22" y="328" class="small">Typed requests, responses and errors</text>
      <text x="22" y="351" class="small">Mock / HTTP behavior checked together</text>
    </g>

    <g transform="translate(804 188)" filter="url(#shadow)">
      <rect width="322" height="384" rx="26" fill="#FFFFFF" stroke="#E8E4DF"/>
      <rect x="20" y="20" width="73" height="27" rx="13.5" fill="#FFE4E0"/>
      <text x="35" y="39" class="card-sub">03 · API</text>
      <text x="22" y="82" class="card-title">Orchestration layer</text>
      <text x="22" y="111" class="small">Same route handler in local Node and Vercel</text>

      <rect x="22" y="138" width="278" height="60" rx="14" fill="#F9F6EF"/>
      <text x="40" y="163" class="body" font-weight="700">Node HTTP / Vercel Function</text>
      <text x="40" y="185" class="mono">apps/api/src/routes.ts</text>

      <rect x="22" y="212" width="278" height="68" rx="14" fill="#F7F7F6"/>
      <text x="40" y="237" class="body" font-weight="700">Request boundary</text>
      <text x="40" y="260" class="small">auth · validation · stable error mapping</text>

      <rect x="22" y="294" width="278" height="64" rx="14" fill="#F7F7F6"/>
      <text x="40" y="319" class="body" font-weight="700">Domain repositories</text>
      <text x="40" y="342" class="small">profile · post · thread · draft · inbox</text>
    </g>

    <g transform="translate(1174 188)" filter="url(#shadow)">
      <rect width="362" height="384" rx="26" fill="url(#ink)"/>
      <rect x="20" y="20" width="93" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="35" y="39" class="card-sub white">04 · TRUST</text>
      <text x="22" y="82" class="card-title white">Supabase data boundary</text>
      <text x="22" y="111" font-size="14" fill="#CFC9C5">Request-scoped client carries the viewer JWT</text>

      <rect x="22" y="138" width="318" height="72" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="40" y="164" class="body white" font-weight="700">Identity derivation</text>
      <text x="40" y="188" class="mono white">JWT → auth.uid() → LineSpace user</text>

      <rect x="22" y="224" width="318" height="62" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="40" y="250" class="body white" font-weight="700">Final authorization</text>
      <text x="40" y="273" font-size="14" fill="#CFC9C5">RLS · constraints · actor-derived RPCs</text>

      <rect x="22" y="300" width="318" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.08"/>
      <text x="40" y="325" class="body white" font-weight="700">Durable domains</text>
      <text x="40" y="347" font-size="14" fill="#CFC9C5">Post · Thread · Draft · Inbox · Storage</text>
    </g>

    <g transform="translate(64 616)" filter="url(#shadow)">
      <rect width="1472" height="242" rx="28" fill="#FFFFFF" stroke="#E8E4DF"/>
      <text x="24" y="40" class="card-sub">BOUNDED AI MEDIATION · SERVER ONLY</text>

      <g transform="translate(24 60)">
        <rect width="676" height="154" rx="20" fill="#FFF8F6" stroke="#F6D8D2"/>
        <circle cx="34" cy="36" r="14" fill="url(#accent)"/>
        <text x="62" y="42" class="card-title">Community / Creative Spark</text>
        <text x="24" y="76" class="body">Poem + bounded reader comments → language lock → 3 structured ideas</text>
        <text x="24" y="104" class="body">source-comment validation → baseRevision → atomic apply / undo</text>
        <text x="24" y="132" class="small">Private request analytics record status, latency and token counts; not poem text.</text>
      </g>

      <path d="M730 138H766" stroke="#F5324A" stroke-width="3" marker-end="url(#arrow)"/>

      <g transform="translate(790 60)">
        <rect width="658" height="154" rx="20" fill="#F7F7F6" stroke="#E8E4DF"/>
        <circle cx="34" cy="36" r="14" fill="#151515"/>
        <text x="62" y="42" class="card-title">Thread Version snapshots</text>
        <text x="24" y="76" class="body">content_revision → durable debounced job → DeepSeek → shared snapshot</text>
        <text x="24" y="104" class="body">Recommended keeps original lines · Harmonized exposes each changed line</text>
        <text x="24" y="132" class="small">Previous ready snapshot can be served as stale; daily Cron drains unfinished jobs.</text>
      </g>
    </g>

    <g transform="translate(64 890)">
      <circle cx="6" cy="-5" r="5" fill="#F5324A"/>
      <text x="20" y="0" class="small">Cross-cutting delivery: signed uploads · Supabase image transforms · batch queries · query prefetch · Vercel Speed Insights · structural checks</text>
      <text x="1472" y="0" text-anchor="end" class="mono">LineSpace · 2026-08-05</text>
    </g>
  </g>
</svg>
